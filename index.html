  const pb = {}; ts.forEach(t => { const k = t.acc + ":" + t.magic; pb[k] = pb[k] || { t, v: 0, n: 0 }; pb[k].v += t.plU; pb[k].n++; });
  const bl = Object.values(pb).sort((a, b) => b.v - a.v);
  const movidas = EVENTS.filter(e => e.at >= lun && e.at <= now && evActual(e)).map(e => { const s = symsDe(e)[0], r = s ? reactionFor(e, s) : null; return { e, s, r }; })
    .filter(x => x.r != null).sort((a, b) => Math.abs(b.r) - Math.abs(a.r)).slice(0, 3);
  const quedan = filterEvents(EVENTS, newsSyms(), "high").filter(e => e.at > now).slice(0, 4);
  return [
    `<div class="st-k">Tu semana</div><h3 class="st-h"><span class="${cls(semana)}">${esc(fmtMoney(semana, true, cs()))}</span></h3>
      <div class="st-days">${keys.map(k => { const v = porDia[k], [Y, M, D] = k.split("-").map(Number);
        return `<div class="st-day"><span class="st-col"><i class="${v >= 0 ? "pos" : "neg"}" style="height:${Math.max(4, Math.abs(v) / mx * 100).toFixed(0)}%"></i></span><b class="mono ${cls(v)}">${esc(fmtK(v))}</b><span>${DOW_SHORT[new Date(Y, M - 1, D).getDay()]}</span></div>`; }).join("")}</div>
      <div class="st-foot">${ts.length} operaciones · ${fmtNum(anStats(ts).win, 0)} % acierto</div>`,
    `<div class="st-k">Por cuenta</div><h3 class="st-h">Quién ha hecho la semana</h3>
      <div class="st-list">${porCuenta.map(x => `<div class="st-li">${accDot(x.a)}<span class="nm">${esc(x.a.nombre)}</span><span class="st-bar"><i class="${x.v >= 0 ? "pos" : "neg"}" style="width:${(Math.abs(x.v) / mxC * 100).toFixed(1)}%"></i></span><b class="mono ${cls(x.v)}">${esc(fmtK(x.v))}</b></div>`).join("")}</div>`,
    `<div class="st-k">Tus bots</div><h3 class="st-h">${bl[0] ? esc(botName(opBot(bl[0].t))) + " manda" : "Sin operaciones"}</h3>
      <div class="st-list">${bl.slice(0, 5).map(x => `<div class="st-li">${accDot(cuentaDe(x.t.acc))}<span class="nm">${esc(botName(opBot(x.t)))}</span><span class="tiny faint">${x.n} ops</span><b class="mono ${cls(x.v)}">${esc(fmtK(x.v))}</b></div>`).join("")}</div>`,
    `<div class="st-k">Noticias</div><h3 class="st-h">Lo que más movió</h3>
      <div class="st-list">${movidas.map(x => `<div class="st-li"><span class="nm">${esc(evNombre(x.e))}</span><b class="mono ${cls(x.r)}">${esc(symShort(x.s))} ${fmtPct(x.r)}</b></div>`).join("") || `<div class="small muted">Esta semana todavía no ha salido nada fuerte.</div>`}</div>
      ${quedan.length ? `<div class="st-sub" style="margin-top:14px">Lo que queda</div><div class="st-list">${quedan.map(e => `<div class="st-li"><b class="mono">${esc(dShort(e.at))} ${hhmm(e.at)}</b><span class="nm">${esc(evNombre(e))}</span></div>`).join("")}</div>` : ""}`,
  ];
}
function openStory(kind) {
  story.kind = kind; story.list = kind === "semana" ? storiesSemana() : storiesHoy(); story.i = 0;
  S.storySeen = Object.assign({}, S.storySeen, { [kind]: dayKey(Date.now()) }); save();
  $("#story").hidden = false; renderStory(); renderScreen("panel");
}
function renderStory() {
  const el = $("#story");
  el.innerHTML = `<div class="st-bars">${story.list.map((_, k) => `<i class="${k < story.i ? "done" : k === story.i ? "now" : ""}"><b></b></i>`).join("")}</div>
    <div class="st-top"><span class="st-av">${ic("logo")}</span><b>${story.kind === "semana" ? "Tu semana" : "Hoy"}</b><span class="tiny faint">${story.i + 1} de ${story.list.length}</span><span class="grow"></span><button class="icon-btn" data-act="st-close" aria-label="Cerrar">${ic("close")}</button></div>
    <div class="st-card">${story.list[story.i]}</div>
    <button class="st-nav prev" data-act="st-prev" aria-label="Anterior"></button><button class="st-nav next" data-act="st-next" aria-label="Siguiente"></button>`;
  clearTimeout(story.timer); story.timer = setTimeout(() => storyGo(1), 9000);
}
function storyGo(d) { story.i += d; if (story.i < 0) story.i = 0; if (story.i >= story.list.length) return closeStory(); renderStory(); }
function closeStory() { clearTimeout(story.timer); $("#story").hidden = true; $("#story").innerHTML = ""; }
/* Fila de accesos del Panel: historias y herramientas */
function accesosHtml(now) {
  const seen = S.storySeen || {}, hoyK = dayKey(now);
  const nx = nextEvent(filterEvents(EVENTS, newsSyms(), "high"), now), cerca = nx && nx.at - now < 90 * MIN;
  const it = (act, v, icon, txt, cls2 = "") => `<button class="st-b ${cls2}" data-act="${act}" ${v ? `data-v="${v}"` : ""}><span class="st-c">${ic(icon)}</span><span>${txt}</span></button>`;
  return `<div class="st-row">
    ${it("story", "hoy", "sunrise", "Hoy", seen.hoy === hoyK ? "seen" : "new")}
    ${it("story", "semana", "layers", "Tu semana", seen.semana === hoyK ? "seen" : "new")}
    ${nx ? it("page", "directo:" + nx.id, "pulse", cerca ? "En directo" : "Directo", cerca ? "live" : "") : ""}
    ${it("page", "analisis", "panel", "Análisis")}
    ${it("page", "guardian", "shield", "Guardián")}
    ${it("calc", "", "calc", "Lotaje")}
  </div>`;
}

/* ---------- arranque ---------- */
function boot() {
  $("#tabbar").innerHTML = [["news", "news", "Noticias"], ["panel", "panel", "Panel"], ["bots", "logo", "Monitor"], ["alerts", "bell", "Avisos"], ["settings", "gear", "Ajustes"]]
    .map(([t, i, l]) => `<button class="tab" data-tab="${t}" role="tab">${ic(i)}<span>${l}</span>${t === "alerts" ? '<span class="badge" id="badge" hidden></span>' : ""}</button>`).join("");
  $("#fab").innerHTML = ic("plus");
  $("#sheet-close").innerHTML = ic("close");
  $("#notif .ap").innerHTML = ic("logo");
  $("#lock-logo").innerHTML = ic("lock");
  document.documentElement.style.setProperty("--tabh", $("#tabbar").offsetHeight + "px");
  $("#app").addEventListener("scroll", () => { const a = $("#app"); if (a.scrollTop || a.scrollLeft) { a.scrollTop = 0; a.scrollLeft = 0; } });
  const hash = (location.hash || "").slice(1);
  if (RENDER[hash]) ui.tab = hash;
  rebuildEvents(); demoInyectar();
  if (S.demo && !S.evDemo) {                      // alerta de ejemplo con IA para la próxima noticia fuerte
    const ev = nextEvent(filterEvents(EVENTS, S.instruments, "high").filter(e => e.forecast && e.country === "USD"), Date.now());
    if (ev) { const a = newDraft("evento", ev); delete a._new; Object.assign(a, { id: "a11", ejemplo: true, cond: "mayor", pausa: true, repetir: "siempre", despues: true, umbral: simValor(ev.forecast, 1, pasoDe(ev)) }); S.alerts.unshift(a); }
    S.evDemo = 1; save();
  }
  applyLook(); renderAll();
  if (NATIVE) {
    if (S.faceId) window.appLock();
    postNative({ type: "requestPermission" });
    postNative({ type: "schedule", reminders: nativeSchedule() });
    maybeFetchNews(false);
  }
  poll();
}
boot();

</script>
