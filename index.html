<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Centinela</title>
<style>
@font-face{font-family:"Archivo";src:url("archivo.woff2") format("woff2");font-weight:100 900;font-stretch:62% 125%;font-display:swap}
@font-face{font-family:"JetBrains Mono";src:url("jetbrains-mono.woff2") format("woff2");font-weight:100 800;font-display:swap}
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{-webkit-text-size-adjust:100%}
body{margin:0;-webkit-user-select:none;-webkit-touch-callout:none}
input,textarea{-webkit-user-select:auto}
[hidden]{display:none!important}
</style>
<style>
/* Layout: app de una pantalla con 5 pestañas abajo; cada pantalla tiene su propio scroll.
   Cifras en monoespaciada (tabla de cotizaciones); títulos en Archivo ancho (rótulo de panel de control). */
:root{
  --bg:#ECEFF4; --surface:#FFFFFF; --surface-2:#F4F6FA; --line:#DCE1EA; --line-2:#C9D0DC;
  --ink:#111723; --muted:#586274; --faint:#8790A1;
  --acc-l:#3346D3; --acc-d:#8E9BFF; --accent:var(--acc-l); --accent-ink:#FFFFFF; --accent-soft:#E4E8FD;
  --up:#0A9466; --up-soft:#DDF3EA; --down:#D63445; --down-soft:#FBE3E6; --warn:#B86E00; --warn-soft:#FBEED9;
  --imp-high:#D63445; --imp-med:#E07400; --imp-low:#B89500; --imp-off:#D3D8E1;
  --shadow:0 1px 2px rgba(17,23,35,.06),0 4px 14px rgba(17,23,35,.05);
  --scrim:rgba(10,14,22,.38); --tabbar:rgba(255,255,255,.86); --outside:#DDE2EA;
  --c1:#2a78d6; --c2:#eb6834; --c3:#1baf7a; --c4:#eda100; --c5:#e87ba4;
  --f-display:"Archivo",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-body:"Archivo",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --r:14px; --r-sm:10px;
  font-size:15px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0A0E15; --surface:#121925; --surface-2:#18212F; --line:#222C3B; --line-2:#2E3A4C;
    --ink:#E5EAF2; --muted:#98A2B4; --faint:#677186;
    --accent:var(--acc-d); --accent-ink:#0A0E15; --accent-soft:#1D2550;
    --up:#34D39A; --up-soft:#0F2E24; --down:#FF6B77; --down-soft:#3A1720; --warn:#F5A524; --warn-soft:#33240C;
    --imp-high:#FF6B77; --imp-med:#F59E0B; --imp-low:#E3C548; --imp-off:#2A3445;
    --shadow:0 1px 0 rgba(255,255,255,.03),0 6px 18px rgba(0,0,0,.35);
    --scrim:rgba(0,0,0,.55); --tabbar:rgba(14,20,30,.88); --outside:#05080D;
    --c1:#3987e5; --c2:#d95926; --c3:#199e70; --c4:#c98500; --c5:#d55181;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0A0E15; --surface:#121925; --surface-2:#18212F; --line:#222C3B; --line-2:#2E3A4C;
  --ink:#E5EAF2; --muted:#98A2B4; --faint:#677186;
  --accent:var(--acc-d); --accent-ink:#0A0E15; --accent-soft:#1D2550;
  --up:#34D39A; --up-soft:#0F2E24; --down:#FF6B77; --down-soft:#3A1720; --warn:#F5A524; --warn-soft:#33240C;
  --imp-high:#FF6B77; --imp-med:#F59E0B; --imp-low:#E3C548; --imp-off:#2A3445;
  --shadow:0 1px 0 rgba(255,255,255,.03),0 6px 18px rgba(0,0,0,.35);
  --scrim:rgba(0,0,0,.55); --tabbar:rgba(14,20,30,.88); --outside:#05080D;
  --c1:#3987e5; --c2:#d95926; --c3:#199e70; --c4:#c98500; --c5:#d55181;
  color-scheme:dark;
}
:root[data-size="large"]{font-size:17px}

*,*::before,*::after{box-sizing:border-box}
html{height:100%;background:var(--outside);-webkit-text-size-adjust:100%}
body{height:100%;margin:0;background:var(--outside);color:var(--ink);font-family:var(--f-body);font-size:1rem;line-height:1.4;
  -webkit-font-smoothing:antialiased;overflow:hidden;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.num,.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums;letter-spacing:-.01em}

/* ---------- armazón ---------- */
#app{position:relative;height:100%;max-width:460px;margin:0 auto;background:var(--bg);display:flex;flex-direction:column;overflow:hidden;overflow:clip}
@media (min-width:520px){#app{border-left:1px solid var(--line);border-right:1px solid var(--line)}}
.screens{position:relative;flex:1;min-height:0}
.screen{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 28px}
.screen[hidden]{display:none!important}
.stack{display:flex;flex-direction:column;gap:14px}

/* cabecera de cada pantalla */
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding:18px 0 14px}
.head h1{margin:0;font-family:var(--f-display);font-variation-settings:"wdth" 118;font-weight:800;font-size:1.9rem;letter-spacing:-.025em;line-height:1}
.eyebrow{font-family:var(--f-mono);font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.pc-chip{display:inline-flex;align-items:center;gap:7px;height:30px;padding:0 11px;border-radius:99px;background:var(--surface);border:1px solid var(--line);
  font-size:.78rem;font-weight:600;color:var(--muted);white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:var(--faint);flex:none}
.dot.on{background:var(--up);box-shadow:0 0 0 3px var(--up-soft)}
.dot.demo{background:var(--warn);box-shadow:0 0 0 3px var(--warn-soft)}
.dot.off{background:var(--down)}

/* tarjetas */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:14px}
.card.flat{box-shadow:none}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.card-t{font-family:var(--f-display);font-variation-settings:"wdth" 110;font-weight:700;font-size:1rem;letter-spacing:-.01em;margin:0}
.label{font-family:var(--f-mono);font-size:.68rem;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)} .faint{color:var(--faint)}
.small{font-size:.82rem} .tiny{font-size:.72rem}
.up{color:var(--up)} .down{color:var(--down)} .warn{color:var(--warn)}
.sect-t{display:flex;align-items:baseline;justify-content:space-between;margin:10px 2px -4px}
.sect-t h2{margin:0;font-family:var(--f-display);font-variation-settings:"wdth" 112;font-weight:750;font-size:1.08rem;letter-spacing:-.01em}

/* botones */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:42px;padding:0 16px;border-radius:12px;font-weight:650;font-size:.92rem;
  background:var(--surface-2);border:1px solid var(--line);color:var(--ink);transition:transform .12s ease,background .15s}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{background:var(--down);border-color:var(--down);color:#fff}
.btn.ghost-danger{background:var(--down-soft);border-color:transparent;color:var(--down)}
.btn.block{width:100%}
a.btn{text-decoration:none}
#s-alerts{padding-bottom:96px}
.btn.sm{min-height:34px;padding:0 12px;font-size:.82rem;border-radius:10px}
.btn svg{width:18px;height:18px;flex:none}
.icon-btn{width:38px;height:38px;border-radius:11px;display:inline-grid;place-items:center;color:var(--muted);flex:none}
.icon-btn:active{background:var(--surface-2)}
.icon-btn svg{width:20px;height:20px}
.icon-btn.on{color:var(--accent);background:var(--accent-soft)}

/* chips y segmentos */
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:2px 16px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 13px;border-radius:99px;border:1px solid var(--line);background:var(--surface);
  font-size:.85rem;font-weight:600;color:var(--muted);white-space:nowrap}
.chip.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.chip .x{font-family:var(--f-mono);font-size:.7rem;opacity:.7}
.seg{display:flex;padding:3px;border-radius:12px;background:var(--surface-2);border:1px solid var(--line);gap:2px}
.seg button{flex:1;min-height:32px;border-radius:9px;font-size:.82rem;font-weight:650;color:var(--muted);padding:0 8px;white-space:nowrap}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}

/* barras de impacto (como cobertura: 1-3 rayas) */
.imp{display:inline-flex;align-items:flex-end;gap:2px;height:14px;flex:none}
.imp i{display:block;width:3.5px;border-radius:1px;background:var(--imp-off)}
.imp i:nth-child(1){height:6px}.imp i:nth-child(2){height:10px}.imp i:nth-child(3){height:14px}
.imp.low i:nth-child(1){background:var(--imp-low)}
.imp.medium i:nth-child(-n+2){background:var(--imp-med)}
.imp.high i{background:var(--imp-high)}
.pill{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 8px;border-radius:6px;font-size:.7rem;font-weight:700;letter-spacing:.02em;white-space:nowrap}
.pill.high{background:var(--down-soft);color:var(--imp-high)}
.pill.medium{background:var(--warn-soft);color:var(--imp-med)}
.pill.low{background:var(--surface-2);color:var(--muted)}
.pill.ok{background:var(--up-soft);color:var(--up)}
.pill.off{background:var(--surface-2);color:var(--muted)}
.pill.acc{background:var(--accent-soft);color:var(--accent)}
.cur{font-family:var(--f-mono);font-size:.68rem;font-weight:700;letter-spacing:.04em;padding:2px 5px;border-radius:4px;background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.sym{font-family:var(--f-mono);font-size:.7rem;font-weight:600;padding:2px 6px;border-radius:5px;background:var(--accent-soft);color:var(--accent)}

/* ---------- Noticias ---------- */
.sessions .rows{display:grid;grid-template-columns:76px 1fr;row-gap:6px;column-gap:10px;align-items:center;position:relative}
.sessions .nm{font-size:.76rem;color:var(--muted);font-weight:600}
.sessions .track{position:relative;height:8px;border-radius:4px;background:var(--surface-2)}
.sessions .band{position:absolute;top:0;bottom:0;border-radius:4px;background:var(--line-2)}
.sessions .band.live{background:var(--accent)}
.sessions .now{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink);border-radius:2px}
.sessions .ticks{display:flex;justify-content:space-between;font-family:var(--f-mono);font-size:.62rem;color:var(--faint);margin:6px 0 0 86px}
.sessions .status{font-size:.86rem;font-weight:600}

.hero{position:relative;overflow:hidden;padding:16px}
.hero .top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.hero h3{margin:12px 0 2px;font-family:var(--f-display);font-variation-settings:"wdth" 108;font-weight:750;font-size:1.22rem;letter-spacing:-.015em;line-height:1.15;text-wrap:balance}
.hero .es{color:var(--muted);font-size:.9rem}
.countdown{display:flex;align-items:baseline;gap:10px;margin:14px 0 4px}
.countdown .big{font-family:var(--f-mono);font-weight:600;font-size:2.35rem;letter-spacing:-.04em;line-height:1}
.hero .meta{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.82rem;color:var(--muted)}
.hero .meta b{color:var(--ink);font-family:var(--f-mono);font-weight:600}
.hero .foot{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:14px;padding-top:12px;border-top:1px dashed var(--line-2)}
.hero::after{content:"";position:absolute;right:-60px;top:-60px;width:180px;height:180px;border-radius:50%;
  background:repeating-radial-gradient(circle,transparent 0 17px,var(--line) 17px 18px);opacity:.55;pointer-events:none}

.filters{display:flex;flex-direction:column;gap:10px}
.days{display:grid;grid-template-columns:1.4fr repeat(5,1fr);gap:6px}
.day{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;height:52px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--muted)}
.day .d{font-size:.68rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.day .n{font-family:var(--f-mono);font-size:1rem;font-weight:600;color:var(--ink)}
.day .dots{display:flex;gap:2px;height:4px}
.day .dots i{width:4px;height:4px;border-radius:50%;background:var(--imp-high)}
.day.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.day.on .n{color:var(--bg)}
.day.today:not(.on){border-color:var(--accent)}
.day.past{opacity:.55}

.group-h{display:flex;justify-content:space-between;align-items:baseline;margin:6px 2px 6px;font-family:var(--f-display);font-variation-settings:"wdth" 110;font-weight:700;font-size:.95rem}
.group-h span{font-family:var(--f-mono);font-size:.7rem;color:var(--faint);font-weight:500}
.evlist{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.ev{display:grid;grid-template-columns:46px 16px minmax(0,1fr) 38px;gap:10px;align-items:center;padding:11px 8px 11px 12px;border-top:1px solid var(--line);width:100%;text-align:left}
.ev:first-child{border-top:0}
.ev .t{font-family:var(--f-mono);font-size:.86rem;font-weight:600}
.ev .t small{display:block;font-size:.62rem;color:var(--faint);font-weight:500}
.ev .ti{font-weight:650;font-size:.92rem;line-height:1.25;overflow-wrap:anywhere}
.ev .sub{font-size:.78rem;color:var(--muted);margin-top:2px;display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center}
.ev .nums{font-family:var(--f-mono);font-size:.72rem;color:var(--muted)}
.ev.past{opacity:.5}
.ev .bell{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;color:var(--faint)}
.ev .bell.on{color:var(--accent);background:var(--accent-soft)}
.ev .bell svg{width:18px;height:18px}
.nowline{display:flex;align-items:center;gap:8px;padding:6px 12px;background:var(--accent-soft);color:var(--accent);font-family:var(--f-mono);font-size:.7rem;font-weight:700;letter-spacing:.04em}
.nowline::after{content:"";flex:1;height:1px;background:currentColor;opacity:.4}
.empty{padding:22px 16px;text-align:center;color:var(--muted);font-size:.9rem}
.source{font-size:.74rem;color:var(--faint);text-align:center;padding:6px 10px 0}

/* ---------- Panel ---------- */
.banner{display:flex;gap:10px;align-items:flex-start;padding:11px 12px;border-radius:12px;background:var(--warn-soft);color:var(--ink);font-size:.82rem;line-height:1.35}
.banner svg{width:18px;height:18px;flex:none;color:var(--warn);margin-top:1px}
.banner button{color:var(--warn);font-weight:700;text-decoration:underline;text-underline-offset:2px}
.equity .big{font-family:var(--f-mono);font-weight:600;font-size:2.2rem;letter-spacing:-.045em;line-height:1.05}
.equity .today{display:inline-flex;gap:8px;align-items:center;margin-top:6px;font-family:var(--f-mono);font-size:.86rem;font-weight:600}
.kv{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px 10px;margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.kv .v{font-family:var(--f-mono);font-weight:600;font-size:.9rem;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hide-money .money{filter:blur(7px);user-select:none}
.chart{display:block;width:100%;height:auto}
.chart text{font-family:var(--f-mono);font-size:10px;fill:var(--faint)}
.mk-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.mk{padding:12px}
.mk .s{display:flex;justify-content:space-between;align-items:center;gap:6px}
.mk .p{font-family:var(--f-mono);font-weight:600;font-size:1.12rem;letter-spacing:-.03em;margin-top:6px}
.mk .c{font-family:var(--f-mono);font-size:.76rem;font-weight:600;margin-top:2px}
.range{position:relative;height:6px;border-radius:3px;background:var(--surface-2);margin:10px 0 4px}
.range i{position:absolute;top:-3px;width:3px;height:12px;border-radius:2px;background:var(--ink)}
.range b{position:absolute;top:0;bottom:0;border-radius:3px;background:var(--line-2)}
.range-l{display:flex;justify-content:space-between;font-family:var(--f-mono);font-size:.62rem;color:var(--faint)}
.pos{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;padding:11px 0;border-top:1px solid var(--line)}
.pos:first-of-type{border-top:0}
.pos .l1{display:flex;align-items:center;gap:7px;font-weight:650;font-size:.9rem}
.side{font-family:var(--f-mono);font-size:.66rem;font-weight:800;padding:2px 5px;border-radius:4px}
.side.buy{background:var(--up-soft);color:var(--up)} .side.sell{background:var(--down-soft);color:var(--down)}
.pos .l2{font-family:var(--f-mono);font-size:.72rem;color:var(--muted)}
.pos .pl{font-family:var(--f-mono);font-weight:700;font-size:.92rem;text-align:right}
.candle-row{display:grid;grid-template-columns:66px minmax(0,1fr) 72px;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.candle-row:first-of-type{border-top:0}
.candle-row .dname{font-size:.78rem;font-weight:650;line-height:1.1}
.candle-row .dname small{display:block;white-space:nowrap;font-family:var(--f-mono);font-size:.62rem;color:var(--faint);font-weight:500}
.hc{position:relative;height:18px}
.hc .wick{position:absolute;top:8px;height:2px;border-radius:1px;background:var(--line-2)}
.hc .body{position:absolute;top:2px;height:14px;border-radius:3px}
.hc .body.up{background:var(--up)} .hc .body.down{background:var(--down)}
.candle-row .chg{text-align:right;font-family:var(--f-mono);font-size:.82rem;font-weight:700}
.candle-row .chg small{display:block;font-size:.64rem;color:var(--muted);font-weight:500}
.vol-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;padding:10px 0;border-top:1px solid var(--line)}
.vol-row:first-of-type{border-top:0}
.vol-row .w{font-size:.78rem;color:var(--muted);font-family:var(--f-mono)}
.vol-row .n{font-weight:650;font-size:.88rem}
.vol-row .m{text-align:right;font-family:var(--f-mono);font-size:.76rem;line-height:1.5;white-space:nowrap}

/* ---------- Bots ---------- */
.pc-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px 10px}
.pc-grid .v{font-family:var(--f-mono);font-weight:600;font-size:.92rem;margin-top:3px}
.meter{height:4px;border-radius:2px;background:var(--surface-2);margin-top:5px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent);border-radius:2px}
.quick{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.quick button{display:flex;flex-direction:column;align-items:center;gap:7px;padding:12px 6px;border-radius:12px;background:var(--surface);border:1px solid var(--line);font-size:.76rem;font-weight:650;color:var(--ink);text-align:center;line-height:1.2}
.quick svg{width:22px;height:22px;color:var(--accent)}
.bot{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;width:100%;text-align:left;padding:13px 14px}
.bot .nm{font-family:var(--f-display);font-variation-settings:"wdth" 108;font-weight:750;font-size:1rem}
.bot .meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:5px;font-family:var(--f-mono);font-size:.68rem;color:var(--muted)}
.bot .r{text-align:right}
.bot .pl{font-family:var(--f-mono);font-weight:700;font-size:1rem}
.bot svg.spark{display:block;width:84px;height:26px;margin-left:auto;margin-top:4px}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface-2)}
.stepper button{width:34px;height:34px;font-size:1.1rem;font-weight:700;color:var(--muted)}
.stepper span{min-width:58px;text-align:center;font-family:var(--f-mono);font-weight:600;font-size:.86rem}
.guard-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.next-win{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:10px;background:var(--surface-2);font-size:.82rem;margin-top:10px}
.next-win svg{width:18px;height:18px;color:var(--warn);flex:none}
.log li{display:grid;grid-template-columns:44px 10px minmax(0,1fr);gap:8px;align-items:baseline;padding:8px 0;border-top:1px solid var(--line);font-size:.84rem}
.log li:first-child{border-top:0}
.log ul{list-style:none;margin:0;padding:0}
.log .tm{font-family:var(--f-mono);font-size:.74rem;color:var(--faint)}
.log .k{width:7px;height:7px;border-radius:50%;background:var(--faint);align-self:center}
.log .k.trade{background:var(--accent)} .log .k.warn{background:var(--warn)} .log .k.cmd{background:var(--up)}
.danger-zone{border-color:color-mix(in srgb,var(--down) 35%,var(--line))}

/* ---------- Avisos ---------- */
.alert{display:grid;grid-template-columns:38px minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 12px 12px 12px;width:100%;text-align:left}
.alert .ic{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent)}
.alert .ic svg{width:20px;height:20px}
.alert .ti{font-weight:700;font-size:.93rem;line-height:1.25}
.alert .de{font-size:.78rem;color:var(--muted);margin-top:2px}
.alert.off .ti,.alert.off .ic{opacity:.45}
.via{display:inline-flex;align-items:center;gap:4px;margin-top:6px;font-family:var(--f-mono);font-size:.64rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--faint)}
.via svg{width:12px;height:12px}
.inbox li{list-style:none;padding:11px 0;border-top:1px solid var(--line)}
.inbox li:first-child{border-top:0}
.inbox ul{margin:0;padding:0}
.inbox .h{display:flex;justify-content:space-between;gap:8px;font-weight:700;font-size:.9rem}
.inbox .h span{font-family:var(--f-mono);font-size:.7rem;color:var(--faint);font-weight:500;white-space:nowrap}
.inbox p{margin:3px 0 0;font-size:.84rem;color:var(--muted)}
.fab{position:absolute;right:max(18px,calc(env(safe-area-inset-right,0px) + 14px));bottom:calc(var(--tabh,64px) + 16px);width:56px;height:56px;border-radius:18px;
  background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;box-shadow:0 8px 22px color-mix(in srgb,var(--accent) 40%,transparent);z-index:5}
.fab svg{width:26px;height:26px}
.fab[hidden]{display:none!important}

/* interruptor */
.sw{position:relative;width:50px;height:30px;flex:none;border-radius:99px;background:var(--line-2);transition:background .18s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .18s}
.sw.on{background:var(--up)}
.sw.on::after{transform:translateX(20px)}

/* ---------- Ajustes ---------- */
.group{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.group-t{margin:14px 4px 6px;font-family:var(--f-mono);font-size:.68rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:52px;padding:10px 14px;border-top:1px solid var(--line);width:100%;text-align:left}
.row:first-child{border-top:0}
.row .rt{font-weight:600;font-size:.94rem}
.row .rd{font-size:.76rem;color:var(--muted);margin-top:2px}
.row .rv{color:var(--muted);font-size:.88rem;font-family:var(--f-mono)}
.row.col{flex-direction:column;align-items:stretch}
.field{width:100%;height:42px;border-radius:10px;border:1px solid var(--line);background:var(--surface-2);padding:0 12px;font-family:var(--f-mono);font-size:.88rem;min-width:0}
.field:focus{outline:2px solid var(--accent);outline-offset:-1px}
textarea.field{height:auto;min-height:70px;padding:10px 12px;font-family:var(--f-body);resize:vertical}
select.field{appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);
  background-position:calc(100% - 17px) 18px,calc(100% - 12px) 18px;background-size:5px 5px;background-repeat:no-repeat;padding-right:30px;font-family:var(--f-body)}
.swatches{display:flex;gap:10px}
.swatch{width:30px;height:30px;border-radius:50%;border:2px solid var(--surface);box-shadow:0 0 0 1px var(--line-2)}
.swatch.on{box-shadow:0 0 0 2px var(--ink)}
.about{text-align:center;padding:18px 0 4px;color:var(--faint);font-size:.78rem}
.about b{display:block;font-family:var(--f-display);font-variation-settings:"wdth" 125;font-weight:800;font-size:1.1rem;color:var(--ink);letter-spacing:-.01em}

/* ---------- barra de pestañas ---------- */
.tabbar{flex:none;display:grid;grid-template-columns:repeat(5,1fr);background:var(--tabbar);border-top:1px solid var(--line);
  -webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);
  padding:6px max(6px,env(safe-area-inset-right,0px)) 6px max(6px,env(safe-area-inset-left,0px));position:relative;z-index:6}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0 4px;border-radius:12px;color:var(--faint);font-size:.66rem;font-weight:650;letter-spacing:.01em}
.tab svg{width:24px;height:24px}
.tab.on{color:var(--accent)}
.tab .badge{position:absolute;margin-left:18px;margin-top:-2px;min-width:16px;height:16px;padding:0 4px;border-radius:8px;background:var(--down);color:#fff;font-size:.6rem;font-weight:800;display:grid;place-items:center}

/* ---------- hojas, avisos, toasts ---------- */
.scrim{position:absolute;inset:0;background:var(--scrim);opacity:0;pointer-events:none;transition:opacity .22s;z-index:20}
.scrim.open{opacity:1;pointer-events:auto}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:90%;display:flex;flex-direction:column;background:var(--bg);border-radius:20px 20px 0 0;
  transform:translateY(105%);transition:transform .28s cubic-bezier(.2,.8,.2,1);z-index:21;box-shadow:0 -10px 40px rgba(0,0,0,.2)}
.sheet.open{transform:none}
.sheet .grab{width:38px;height:5px;border-radius:3px;background:var(--line-2);margin:8px auto 2px;flex:none}
.sheet .sh{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));flex:none}
.sheet .sh h2{margin:0;font-family:var(--f-display);font-variation-settings:"wdth" 112;font-weight:800;font-size:1.25rem;letter-spacing:-.02em}
.sheet .sb{overflow-y:auto;overscroll-behavior:contain;padding:0 max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.types{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.type{display:flex;flex-direction:column;align-items:flex-start;gap:6px;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--surface);text-align:left}
.type svg{width:22px;height:22px;color:var(--accent)}
.type b{font-size:.88rem}
.type span{font-size:.72rem;color:var(--muted);line-height:1.3}
.type.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.form{display:flex;flex-direction:column;gap:12px}
.form .l{display:block;font-size:.78rem;font-weight:650;color:var(--muted);margin-bottom:5px}
.form .two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.dpick{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.dpick button{height:36px;border-radius:9px;border:1px solid var(--line);background:var(--surface);font-weight:700;font-size:.8rem;color:var(--muted)}
.dpick button.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.confirm{padding:12px;border-radius:12px;background:var(--down-soft);display:flex;flex-direction:column;gap:10px;font-size:.88rem}
.confirm .b{display:flex;gap:8px}
.confirm .b .btn{flex:1}
.detail-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.detail-grid div{padding:10px;border-radius:10px;background:var(--surface);border:1px solid var(--line)}
.detail-grid b{display:block;font-family:var(--f-mono);font-size:.86rem;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.move-row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-top:1px solid var(--line);font-size:.9rem}
.move-row:first-child{border-top:0}
.move-row b{font-family:var(--f-mono)}
.toast{position:absolute;left:50%;top:calc(env(safe-area-inset-top,0px) + 10px);transform:translate(-50%,-140%);max-width:calc(100% - 32px);padding:10px 16px;border-radius:12px;
  background:var(--ink);color:var(--bg);font-size:.85rem;font-weight:600;z-index:40;transition:transform .25s cubic-bezier(.2,.8,.2,1);box-shadow:0 8px 24px rgba(0,0,0,.25);text-align:center}
.toast.show{transform:translate(-50%,0)}
.notif{position:absolute;left:10px;right:10px;top:calc(env(safe-area-inset-top,0px) + 8px);z-index:41;padding:11px 13px;border-radius:18px;
  background:color-mix(in srgb,var(--surface) 88%,transparent);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);border:1px solid var(--line);
  box-shadow:0 12px 30px rgba(0,0,0,.22);transform:translateY(-130%);transition:transform .35s cubic-bezier(.2,.9,.2,1);display:grid;grid-template-columns:36px minmax(0,1fr);gap:10px}
.notif.show{transform:none}
.notif .ap{width:36px;height:36px;border-radius:9px;background:var(--ink);display:grid;place-items:center}
.notif .ap svg{width:22px;height:22px;color:var(--bg)}
.notif .hd{display:flex;justify-content:space-between;font-size:.7rem;color:var(--muted);font-weight:600;letter-spacing:.03em;text-transform:uppercase}
.notif .tt{font-weight:700;font-size:.9rem;margin-top:1px}
.notif .bd{font-size:.84rem;color:var(--ink);opacity:.85;line-height:1.3;white-space:pre-line}
.pcshot{border-radius:10px;border:1px solid var(--line);overflow:hidden;background:#0d1117}

@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
@media (max-width:519px){html,body{background:var(--bg)}}

.lock{position:absolute;inset:0;z-index:60;background:var(--bg);display:grid;place-items:center}
.lock[hidden]{display:none!important}
.lock-in{display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center}
.lock-ic{width:64px;height:64px;border-radius:20px;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center;color:var(--accent)}
.lock-ic svg{width:30px;height:30px}
.lock-in b{font-family:var(--f-display);font-variation-settings:"wdth" 112;font-size:1.15rem}
.btn:disabled{opacity:.45;pointer-events:none}

/* ---------- noticias ampliadas e IA (versión 1.1) ---------- */
.spill{display:inline-flex;align-items:center;height:18px;padding:0 6px;border-radius:5px;font-family:var(--f-body);font-size:.66rem;font-weight:800;letter-spacing:.02em;background:var(--surface-2);color:var(--muted);vertical-align:1px;white-space:nowrap}
.spill.good{background:var(--up-soft);color:var(--up)}
.spill.bad{background:var(--down-soft);color:var(--down)}
.spill.acc{background:var(--accent-soft);color:var(--accent)}
.result{display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:8px}
.result>div{padding:10px;border-radius:10px;background:var(--surface);border:1px solid var(--line);min-width:0}
.result b{display:block;font-family:var(--f-mono);font-size:.9rem;margin-top:3px}
.result b.big{font-size:1.4rem;letter-spacing:-.03em}
.lect{display:flex;flex-direction:column;gap:8px}
.lc{padding:10px 12px;border-radius:10px;background:var(--surface-2);display:flex;flex-direction:column;gap:7px;border:1px solid transparent}
.lc.hit{border-color:var(--accent);background:var(--accent-soft)}
.lc .lw{font-weight:650;font-size:.86rem;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.dirs{display:flex;gap:6px;flex-wrap:wrap}
.dir{font-family:var(--f-mono);font-size:.72rem;font-weight:700;padding:3px 7px;border-radius:6px;background:var(--surface);border:1px solid var(--line);white-space:nowrap}
.dir.sube{color:var(--up)} .dir.baja{color:var(--down)} .dir.mixto{color:var(--muted)}
.ia{border-color:color-mix(in srgb,var(--accent) 30%,var(--line))}
.ia-h{display:flex;align-items:center;gap:8px}
.ia-h svg{width:20px;height:20px;color:var(--accent);flex:none}
.md{font-size:.9rem;line-height:1.48;overflow-wrap:anywhere}
.md h4{margin:12px 0 4px;font-family:var(--f-display);font-variation-settings:"wdth" 108;font-size:.95rem;font-weight:750;letter-spacing:-.005em}
.md h4:first-child{margin-top:2px}
.md p{margin:0 0 6px}
.md ul{margin:0 0 6px;padding-left:18px}
.md li{margin:3px 0}
.md b{font-weight:700}
.ia-status{display:flex;align-items:center;gap:8px;font-size:.8rem;color:var(--muted);margin:4px 0 8px}
.spin{width:14px;height:14px;border-radius:50%;border:2px solid var(--line-2);border-top-color:var(--accent);animation:spin .8s linear infinite;flex:none}
@keyframes spin{to{transform:rotate(360deg)}}
.caret>:last-child::after{content:"▍";color:var(--accent);animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
.ia-meta{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-top:10px;padding-top:10px;border-top:1px dashed var(--line-2);font-size:.72rem;color:var(--faint)}
.chat{display:flex;flex-direction:column;gap:10px;margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.chat .q{align-self:flex-end;max-width:85%;padding:8px 12px;border-radius:14px 14px 4px 14px;background:var(--accent);color:var(--accent-ink);font-size:.86rem;overflow-wrap:anywhere}
.chat .a{align-self:stretch;padding:10px 12px;border-radius:14px 14px 14px 4px;background:var(--surface-2)}
.chat .a .md{font-size:.86rem}
.ask{display:flex;flex-direction:column;gap:8px;margin-top:-4px}
.ask[hidden]{display:none!important}
.ask .sug{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:0 16px}
.ask .sug::-webkit-scrollbar{display:none}
.ask .sug button{flex:none;height:32px;padding:0 11px;border-radius:99px;border:1px solid var(--line);background:var(--surface);font-size:.76rem;font-weight:600;color:var(--muted);white-space:nowrap}
.ask-row{display:flex;gap:8px}
.ask-row .field{font-family:var(--f-body);font-size:.92rem;height:44px}
.ask-row .btn{width:48px;padding:0;min-height:44px;flex:none}
.hist{width:100%;border-collapse:collapse;font-size:.78rem}
.hist th{text-align:left;font-family:var(--f-mono);font-size:.62rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:6px 6px 6px 0;border-bottom:1px solid var(--line);white-space:nowrap}
.hist td{padding:8px 6px 8px 0;border-bottom:1px solid var(--line);font-family:var(--f-mono);white-space:nowrap}
.hist tr:last-child td{border-bottom:0}
.spec{padding:9px 0;border-top:1px solid var(--line);font-size:.86rem;line-height:1.4}
.card-h+.spec{border-top:0;padding-top:0}
.spec .label{display:block;margin-bottom:3px}
.agenda .ag-row{display:grid;grid-template-columns:52px minmax(0,1fr);gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:.88rem;line-height:1.35}
.agenda .card-h+.ag-row,.agenda .ag-row:first-child{border-top:0;padding-top:0}
.agenda .ag-row .t{font-family:var(--f-mono);font-weight:600}
.agenda .ag-row.past{opacity:.55}
.ag-ia{display:flex;gap:9px;align-items:flex-start;margin-top:10px;padding:10px 12px;border-radius:10px;background:var(--accent-soft);font-size:.86rem;line-height:1.4}
.ag-ia svg{width:18px;height:18px;color:var(--accent);flex:none;margin-top:1px}

/* ============================================================
   versión 2.0: varias cuentas, resumen sencillo y detalle al tocar
   Colores de cuenta: ranuras categóricas validadas (1-3 pasan todas las parejas,
   siempre acompañadas del nombre); verde y rojo quedan solo para ganar y perder.
   ============================================================ */
.grow{flex:1}
.acc-dot{width:10px;height:10px;border-radius:50%;background:var(--c);flex:none;display:inline-block;box-shadow:0 0 0 2px var(--surface)}
.acc-t{font-family:var(--f-mono);font-size:.6rem;font-weight:600;letter-spacing:.03em;color:var(--muted);background:var(--surface-2);border:1px solid var(--line);padding:1px 5px;border-radius:4px;vertical-align:2px;white-space:nowrap}
.acc-tag{display:inline-flex;align-items:center;gap:5px;font-size:.7rem;font-weight:650;color:var(--muted);margin-right:6px;white-space:nowrap}
.l1 .acc-tag{margin:0 0 0 4px}
.acc-tag .acc-dot{width:7px;height:7px;box-shadow:none}
.acc-tag.big{margin:0;font-size:.84rem;padding:9px 11px;border-radius:10px;background:var(--surface);border:1px solid var(--line);color:var(--ink);cursor:pointer}
.acc-tag.big svg{width:16px;height:16px;margin-left:auto;color:var(--faint)}
[role="button"]{cursor:pointer}

/* Panel: resumen de hoy */
.hero-pl{padding:16px 16px 12px}
.hp-top{display:flex;justify-content:space-between;align-items:center}
.go{display:inline-flex;align-items:center;gap:1px;font-size:.78rem;font-weight:650;color:var(--accent)}
.go svg{width:16px;height:16px}
.hp-big{font-family:var(--f-mono);font-weight:650;font-size:2.45rem;letter-spacing:-.05em;line-height:1.05;margin-top:8px}
.hp-sub{display:flex;gap:12px;flex-wrap:wrap;align-items:baseline;font-family:var(--f-mono);font-size:.84rem;color:var(--muted);margin-top:5px}
.hp-sub b{font-weight:650}
.hp-spark{display:block;width:100%;height:50px;margin:12px 0 10px}
.hp-spark .ln{fill:none;stroke-width:2;stroke-linejoin:round}
.hp-spark .zl{stroke:var(--line-2);stroke-dasharray:3 3}
.hp-foot{display:flex;justify-content:space-between;gap:6px 10px;flex-wrap:wrap;padding-top:10px;border-top:1px solid var(--line);font-size:.74rem;color:var(--muted);font-weight:600}
.hp-foot span{display:inline-flex;align-items:center;gap:6px}
.card.list{padding:0;overflow:hidden}
.acc-row{display:grid;grid-template-columns:10px minmax(0,1fr) auto auto;gap:12px;align-items:center;padding:12px 14px;border-top:1px solid var(--line)}
.acc-row:first-child{border-top:0}
.card-h + .acc-row{border-top:0}
.acc-n{font-weight:700;font-size:.95rem;line-height:1.2;overflow-wrap:anywhere}
.acc-s{font-size:.74rem;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acc-row svg.spark{width:56px;height:22px;display:block}
.acc-off{width:56px;display:grid;place-items:center;color:var(--warn)}
.acc-off svg{width:18px;height:18px}
.acc-pl{text-align:right;font-family:var(--f-mono);min-width:80px}
.acc-pl b{display:block;font-size:.9rem;font-weight:650;white-space:nowrap}
.acc-pl small{font-size:.68rem;font-weight:600}
.acc-row:active,.mk2:active,.hero-pl:active,.eqp:active,.next-n:active,.bot-mini:active,.div-row:active{background:var(--surface-2)}
.mk2{padding:12px}
.mk2 .s{display:flex;justify-content:space-between;align-items:center;gap:6px}
.mk2 .c{font-family:var(--f-mono);font-size:.74rem;font-weight:650}
.mk2 .p{font-family:var(--f-mono);font-weight:600;font-size:1.15rem;letter-spacing:-.03em;margin-top:8px}
.pos-h{display:flex;align-items:center;gap:8px;min-height:28px}
.tw{display:inline-grid;color:var(--faint);transition:transform .2s}
.tw svg{width:18px;height:18px}
.tw.open{transform:rotate(90deg)}
.pos-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.pchip{font-size:.74rem;padding:4px 8px;border-radius:7px;background:var(--surface-2);border:1px solid var(--line);color:var(--muted)}
.pchip b{color:var(--ink);font-family:var(--f-mono);font-size:.72rem}
.pos-g{display:flex;align-items:center;gap:8px;margin-top:12px;padding-top:10px;border-top:1px solid var(--line);font-size:.84rem}

/* ---------- utilidades ---------- */
function hashId(s) {
  let h = 5381;
  for (let i = 0; i < s.length; i++) h = ((h << 5) + h + s.charCodeAt(i)) | 0;
  return "e" + (h >>> 0).toString(36);
}
const pad2 = n => String(n).padStart(2, "0");
function hhmm(d) { d = new Date(d); return pad2(d.getHours()) + ":" + pad2(d.getMinutes()); }
function localStamp(d) {
  d = new Date(d);
  return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}T${pad2(d.getHours())}:${pad2(d.getMinutes())}`;
}
function startOfDay(t) { const d = new Date(t); d.setHours(0, 0, 0, 0); return d.getTime(); }
function dayKey(t) { const d = new Date(t); return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`; }

const MONTHS_SHORT = ["ene", "feb", "mar", "abr", "may", "jun", "jul", "ago", "sep", "oct", "nov", "dic"];
function longDay(t) { const d = new Date(t); return `${DOW[d.getDay()]} ${d.getDate()} de ${MONTHS[d.getMonth()]}`; }
function shortDay(t) { const d = new Date(t); return `${DOW[d.getDay()].slice(0, 3)} ${d.getDate()} ${MONTHS_SHORT[d.getMonth()]}`; }

/* Formato numérico español: 29.846,5 */
function fmtNum(n, digits = 2) {
  if (n == null || isNaN(n)) return "—";
  const neg = n < 0; n = Math.abs(n);
  const [i, f] = n.toFixed(digits).split(".");
  const int = i.replace(/\B(?=(\d{3})+(?!\d))/g, ".");
  return (neg ? "−" : "") + int + (f ? "," + f : "");
}
function fmtSigned(n, digits = 2) { return (n > 0 ? "+" : n < 0 ? "" : "±") + fmtNum(n, digits); }
function fmtPct(n, digits = 2) { return fmtSigned(n, digits) + " %"; }
function fmtMoney(n, signed = false, sym = "$") { return (signed ? fmtSigned(n, 2) : fmtNum(n, 2)) + " " + sym; }

/* Duración legible: "2 h 14 min", "3 d 4 h", "45 s" */
function fmtDuration(ms) {
  const s = Math.max(0, Math.round(ms / 1000));
  if (s < 60) return `${s} s`;
  const m = Math.floor(s / 60);
  if (m < 60) return `${m} min`;
  const h = Math.floor(m / 60);
  if (h < 24) return `${h} h ${m % 60} min`;
  return `${Math.floor(h / 24)} d ${h % 24} h`;
}
/* Cuenta atrás tipo reloj si falta menos de un día */
function fmtCountdown(ms) {
  if (ms <= 0) return "00:00:00";
  const s = Math.floor(ms / 1000);
  if (s >= 86400) { const d = Math.floor(s / 86400), h = Math.floor((s % 86400) / 3600); return `${d} d ${h} h`; }
  return `${pad2(Math.floor(s / 3600))}:${pad2(Math.floor((s % 3600) / 60))}:${pad2(s % 60)}`;
}

/* ---------- noticias ---------- */

/* rows: [isoDate, country, impact, title, forecast, previous, actual?, flag?]  flag: 'tentative' | 'allday' */
function normalizeEvents(rows, shiftMs = 0) {
  return rows.map(r => {
    const [date, country, impact, title, forecast = "", previous = "", actual = "", flag = ""] = r;
    const at = new Date(date).getTime() + shiftMs;
    return {
      id: hashId(country + "|" + title + "|" + date),
      at, raw: date, country, impact, title, forecast, previous, actual,
      tentative: flag === "tentative", allDay: flag === "allday",
      es: ES_NAMES[country + "|" + title] || "",
    };
  }).sort((a, b) => a.at - b.at);
}

/* Si la vista previa se abre semanas después, mueve la semana de ejemplo a la actual */
function weekShift(rows, now) {
  const first = new Date(rows[0][0]).getTime();
  const weekStart = startOfDay(first) - ((new Date(first).getDay() + 6) % 7) * DAY;
  const weeks = Math.floor((now - weekStart) / (7 * DAY));
  return weeks > 0 ? weeks * 7 * DAY : 0;
}

/* Qué instrumentos de la lista afecta una noticia */
function affects(ev, instruments) {
  const out = [];
  for (const sym of instruments) {
    const ins = INSTRUMENTS[sym]; if (!ins) continue;
    let hit = ins.cur.includes(ev.country);
    if (!hit && ins.extra && ins.extra[ev.country]) hit = IMPACT_RANK[ev.impact] >= IMPACT_RANK[ins.extra[ev.country]];
    if (!hit && ins.keywords) hit = ins.keywords.some(k => ev.title.includes(k));
    if (hit) out.push(sym);
  }
  return out;
}
/* Impacto efectivo: una noticia propia del instrumento (p. ej. crudo para el petróleo) cuenta como media */
function effectiveImpact(ev, instruments) {
  let r = IMPACT_RANK[ev.impact] || 0;
  for (const sym of instruments) {
    const ins = INSTRUMENTS[sym];
    if (ins && ins.keywords && ins.keywords.some(k => ev.title.includes(k))) r = Math.max(r, IMPACT_RANK.medium);
  }
  return r;
}
function filterEvents(events, instruments, minImpact) {
  const min = IMPACT_RANK[minImpact] || 1;
  return events.filter(ev => affects(ev, instruments).length && effectiveImpact(ev, instruments) >= min);
}
function nextEvent(events, now, preferHigh = true) {
  const fut = events.filter(e => e.at > now && !e.tentative && !e.allDay);
  if (preferHigh) {
    const hi = fut.find(e => e.impact === "high");
    const first = fut[0];
    // si la siguiente de alto impacto llega en menos de 36 h, mándala delante
    if (hi && (!first || hi.at - now < 36 * HOUR)) return hi;
  }
  return fut[0] || null;
}
function typicalMove(ev) {
  return TYPICAL_MOVE[ev.country + "|" + ev.title] || MOVE_BY_IMPACT[ev.impact] || [0, 0];
}

/* ---------- avisos ---------- */

/* Siguientes repeticiones de un recordatorio libre */
function customOccurrences(alert, now, max = 10) {
  const out = [];
  let t = new Date(alert.at).getTime();
  if (isNaN(t)) return out;
  const step = alert.repeat === "daily" ? DAY : alert.repeat === "weekly" ? 7 * DAY : 0;
  if (!step) return t > now ? [t] : [];
  if (t <= now) t += Math.ceil((now - t + 1) / step) * step;
  for (let i = 0; i < max; i++) {
    // mantener la hora local aunque cambie el horario de verano
    const d = new Date(t + i * step), base = new Date(alert.at);
    d.setHours(base.getHours(), base.getMinutes(), 0, 0);
    if (d.getTime() > now) out.push(d.getTime());
  }
  return out;
}

/* Avisos que programa el propio iPhone: [{id, at(ms), title, body}] */
function upcomingReminders(state, events, now) {
  const list = [], seen = new Set();
  const ins = state.instruments;
  const add = (id, at, title, body) => {
    const k = Math.round(at / MIN) + "|" + title;
    if (at <= now || seen.has(k)) return;
    seen.add(k); list.push({ id, at, title, body });
  };
  const evLine = ev => {
    const a = affects(ev, ins).map(s => INSTRUMENTS[s].short).join(", ");
    const nums = [ev.forecast && `Prev. ${ev.forecast}`, ev.previous && `Ant. ${ev.previous}`].filter(Boolean).join(" · ");
    return `${hhmm(ev.at)} · ${ev.country}${a ? " · Afecta a " + a : ""}${nums ? " · " + nums : ""}`;
  };
  for (const al of state.alerts || []) {
    if (!al.on) continue;
    if (al.kind === "news" && state.newsLocal !== false) {
      const min = IMPACT_RANK[al.impact || "high"];
      for (const ev of events) {
        if (ev.tentative || ev.allDay) continue;
        if (!affects(ev, ins).length || effectiveImpact(ev, ins) < min) continue;
        add(`n-${al.id}-${ev.id}`, ev.at - al.lead * MIN, `En ${al.lead} min: ${ev.es || ev.title}`, evLine(ev));
      }
    } else if (al.kind === "custom") {
      for (const t of customOccurrences(al, now)) add(`c-${al.id}-${t}`, t, al.title || "Recordatorio", al.text || "");
    }
  }
  const lead = state.watchLead || 15;
  for (const ev of events) {
    if (!state.watched || !state.watched[ev.id] || ev.tentative || ev.allDay) continue;
    add(`w-${ev.id}`, ev.at - lead * MIN, `En ${lead} min: ${ev.es || ev.title}`, evLine(ev));
  }
  return list.sort((a, b) => a.at - b.at);
}

/* Ventanas en las que los bots se pausan por noticias de alto impacto */
function guardWindows(events, symbols, before, after, now) {
  const wins = [];
  for (const ev of events) {
    if (ev.impact !== "high" || ev.tentative || ev.allDay) continue;
    if (!affects(ev, symbols).length) continue;
    const s = ev.at - before * MIN, e = ev.at + after * MIN;
    if (e < now) continue;
    const last = wins[wins.length - 1];
    if (last && s <= last.end) { last.end = Math.max(last.end, e); last.events.push(ev); }
    else wins.push({ start: s, end: e, events: [ev] });
  }
  return wins;
}

/* ---------- sesiones de mercado ---------- */
function tzOffset(ms, tz) {
  const p = {};
  new Intl.DateTimeFormat("en-US", { timeZone: tz, hourCycle: "h23", year: "numeric", month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit", second: "2-digit" })
    .formatToParts(new Date(ms)).forEach(x => { p[x.type] = x.value; });
  const asUTC = Date.UTC(+p.year, +p.month - 1, +p.day, +p.hour % 24, +p.minute, +p.second);
  return asUTC - (ms - (ms % 1000));
}
/* Hora de reloj en una zona → instante (ms) */
function zonedTime(y, m, d, h, mi, tz) {
  let guess = Date.UTC(y, m, d, h, mi);
  let t = guess - tzOffset(guess, tz);
  t = guess - tzOffset(t, tz);
  return t;
}
const SESSIONS = [
  { key: "syd", name: "Sídney", tz: "Australia/Sydney", open: [7, 0], close: [16, 0] },
  { key: "tok", name: "Tokio", tz: "Asia/Tokyo", open: [9, 0], close: [18, 0] },
  { key: "lon", name: "Londres", tz: "Europe/London", open: [8, 0], close: [17, 0] },
  { key: "ny", name: "Nueva York", tz: "America/New_York", open: [8, 0], close: [17, 0] },
];
/* Tramos de cada sesión que caen dentro del día local de `now` (para dibujar la franja) */
function sessionBands(now) {
  const day0 = startOfDay(now), day1 = day0 + DAY;
  return SESSIONS.map(s => {
    const parts = [];
    for (let k = -1; k <= 1; k++) {
      const ref = new Date(day0 + k * DAY + 12 * HOUR);
      const p = {};
      new Intl.DateTimeFormat("en-US", { timeZone: s.tz, year: "numeric", month: "numeric", day: "numeric" })
        .formatToParts(ref).forEach(x => { p[x.type] = x.value; });
      const dow = new Date(Date.UTC(+p.year, +p.month - 1, +p.day)).getUTCDay();
      if (dow === 0 || dow === 6) continue;                 // sin sesión el fin de semana
      const a = zonedTime(+p.year, +p.month - 1, +p.day, s.open[0], s.open[1], s.tz);
      const b = zonedTime(+p.year, +p.month - 1, +p.day, s.close[0], s.close[1], s.tz);
      if (b > day0 && a < day1) parts.push({ start: Math.max(a, day0), end: Math.min(b, day1), realStart: a, realEnd: b });
    }
    return { ...s, parts };
  });
}
function sessionStatus(now) {
  const bands = sessionBands(now);
  const open = bands.filter(b => b.parts.some(p => p.realStart <= now && now < p.realEnd));
  if (open.length) return { open: open.map(b => b.name), next: null };
  let next = null;
  for (let k = 0; k <= 3 && !next; k++) {
    const bb = sessionBands(now + k * DAY);
    for (const b of bb) for (const p of b.parts)
      if (p.realStart > now && (!next || p.realStart < next.at)) next = { name: b.name, at: p.realStart };
  }
  return { open: [], next };
}

/* ---------- textos de avisos ---------- */
const DAYS_ES = ["L", "M", "X", "J", "V", "S", "D"];
function daysText(days) {
  const k = (days || []).join("");
  if (k === "01234") return "De lunes a viernes";
  if (k === "0123456") return "Todos los días";
  return (days || []).map(i => DAYS_ES[i]).join(" ");
}
function insList(syms) { return (syms || []).map(s => (INSTRUMENTS[s] || {}).short || s).join(", "); }

function describeAlert(al, opts = {}) {

    case "price": return {
      title: `${I(al.symbol)} ${al.cond === "below" ? "baja de" : "sube de"} ${fmtNum(+al.level, Number.isInteger(+al.level) ? 0 : Math.min((INSTRUMENTS[al.symbol] || {}).digits || 2, 5))}`,
      detail: al.repeat ? "Avisa cada vez que cruce el nivel" : "Avisa una vez y se desactiva", via: "pc" };
    case "daily": return {
      title: `Resumen a las ${al.time}`,

    case "move": return {
      title: `${I(al.symbol)} se mueve más de ${fmtNum(+al.pct, 1)} %`,
      detail: al.window === "15m" ? "En 15 minutos" : al.window === "1h" ? "En una hora" : "En lo que va de día", via: "pc" };
    case "news": return {
      title: `${al.lead} min antes de cada noticia`,
      detail: `Impacto ${al.impact === "medium" ? "alto y medio" : "alto"} · Según tus instrumentos`, via: opts.newsByPC ? "pc" : "phone" };
    case "account": {
      const t = { dd: `Pérdida del día supera el ${fmtNum(+al.value, 1)} %`, margin: `Nivel de margen baja del ${fmtNum(+al.value, 0)} %`,
        equity: `Equidad baja de ${fmtMoney(+al.value)}`, trades: "Cada vez que un bot abre o cierra", prop: `Al gastar el ${fmtNum(+al.value, 0)} % del límite diario` }[al.metric];
      const quien = !al.cuenta || al.cuenta === "all" ? "En cada una de tus cuentas" : `En ${opts.cuenta ? opts.cuenta(al.cuenta) : al.cuenta}`;
      return { title: t, detail: al.metric === "prop" ? `${quien} · regla del fondeo` : quien, via: "pc" };
    }
    case "evento": {
      const u = String(al.umbral == null ? "" : al.umbral).replace(/(\d)\.(\d)/g, "$1,$2");
      const cond = { siempre: "", sorpresa: " si sorprende", mayor: ` si sale ≥ ${u}`, menor: ` si sale ≤ ${u}` }[al.cond || "siempre"];
      const m = [al.antes ? `${al.lead} min antes` : "", al.salida ? "al salir" + cond : "", al.despues ? "a los 15 min" : ""].filter(Boolean);
      const det = (m.length ? m.join(", ").replace(/^./, c => c.toUpperCase()) : "Sin momentos elegidos") + (al.ia !== false ? " · con IA" : "") +
        (al.pausa ? ` · pausa bots ${al.pausaMin} min` : "") + (al.repetir === "siempre" ? " · cada vez que salga" : "");
      return { title: al.nombre || "Noticia", detail: det, via: "pc" };
    }
    case "vigia": return {
      title: al.nivel === "medio" ? "Si algo hay que vigilar" : "Si algo se sale de lo normal",
      detail: "Operaciones, bots, MT5 y registros · con la explicación de la IA", via: "pc" };
    case "offline": return {
      title: `Cuenta sin datos más de ${al.minutes} min`,
      detail: "Si un ordenador o un MT5 deja de enviar datos, y cuando vuelve", via: "pc" };
    case "release": return {
      title: "Cuando sale el dato",
      detail: `Cifra, si es mejor o peor de lo esperado y la reacción · impacto ${al.impact === "medium" ? "alto y medio" : "alto"}`, via: "pc" };
    case "agenda": return {
      title: `Agenda del día a las ${al.time}`,
      detail: `${daysText(al.days)} · Noticias importantes de hoy${al.ia !== false ? " con resumen de la IA" : ""}`, via: "pc" };
    case "custom": return {
      title: al.title || "Recordatorio",
      detail: (al.repeat === "weekly" ? "Cada semana" : al.repeat === "daily" ? "Cada día" : "Una vez") + " · " + (al.at ? shortDay(new Date(al.at)) + " " + hhmm(new Date(al.at)) : ""), via: "phone" };
  }
  return { title: "Aviso", detail: "", via: "phone" };
}

/* ============================================================
   Noticias ampliadas: base de conocimiento, sorpresa y lectura rápida
   (INDICADORES lo inserta build.py desde src/indicadores.json)
   ============================================================ */
const KB = (typeof INDICADORES !== "undefined") ? INDICADORES : { categorias: {}, indicadores: [] };

function indicador(country, title) {
  const t = String(title || "").toLowerCase();
  return KB.indicadores.find(ind => (ind.c === "*" || ind.c === country) && ind.p.some(p => t.includes(p.toLowerCase()))) || null;
}
const NUM_MULT = { K: 1e3, M: 1e6, B: 1e9, T: 1e12 };
function parseNum(s) {
  if (s == null) return null;
  const m = String(s).split("|")[0].replace(/−/g, "-").match(/(-?\d+(?:[.,]\d+)?)\s*([KMBT])?/);
  if (!m) return null;
  return parseFloat(m[1].replace(",", ".")) * (NUM_MULT[m[2]] || 1);
}
/* Compara el dato real con la previsión (o con el anterior). signo: 1 mejor para la divisa, -1 peor, 0 igual o sin regla */
function sorpresa(country, title, actual, forecast, previous, mejorFF = 0) {
  const a = parseNum(actual);
  if (a == null) return null;
  let ref = parseNum(forecast), base = "previsión";
  if (ref == null) { ref = parseNum(previous); base = "anterior"; }
  const ind = indicador(country, title) || {};
  const diff = ref == null ? null : a - ref;
  let signo = 0;
  if (diff != null && Math.abs(diff) > 1e-12) {
    if (ind.mejor === "mayor") signo = diff > 0 ? 1 : -1;
    else if (ind.mejor === "menor") signo = diff > 0 ? -1 : 1;
  }
  if (mejorFF === 1 || mejorFF === -1) signo = mejorFF;
  const igual = diff != null && Math.abs(diff) <= 1e-12;
  return { diff, base, signo, igual,
    texto: igual ? `En línea con la ${base === "previsión" ? "previsión" : "dato anterior"}` :
      signo > 0 ? `Mejor de lo esperado para el ${country}` : signo < 0 ? `Peor de lo esperado para el ${country}` : `Distinto de la ${base}` };
}
const GRUPO_SYM = { NAS100: "NAS", US500: "NAS", US30: "NAS", BTCUSD: "NAS", XAUUSD: "ORO", XAGUSD: "ORO", GER40: "DAX" };
/* Hacia dónde suele ir `sym` cuando el dato es bueno (o malo) para la divisa del país */
function efecto(cat, country, sym, bueno = true) {
  const c = KB.categorias[cat] || {};
  let r = "mixto";
  if (country === "USD") {
    if (sym === "EURUSD" || sym === "GBPUSD") r = "baja";
    else if (sym === "USDJPY") r = "sube";
    else if (GRUPO_SYM[sym] === "NAS" || GRUPO_SYM[sym] === "ORO") r = (c.usd || {})[GRUPO_SYM[sym]] || "mixto";
    else if (sym === "USOIL" && ["crecimiento", "consumo", "actividad"].includes(cat)) r = "sube";
  } else if (country === "EUR") {
    if (sym === "EURUSD") r = "sube"; else if (sym === "GER40") r = (c.eur || {}).DAX || "mixto";
  } else if (country === "GBP" && sym === "GBPUSD") r = "sube";
  else if (country === "JPY" && sym === "USDJPY") r = "baja";
  else if (country === "CNY" && ["actividad", "crecimiento"].includes(cat) && ["XAUUSD", "XAGUSD", "USOIL"].includes(sym)) r = "sube";
  if (!bueno && (r === "sube" || r === "baja")) r = r === "sube" ? "baja" : "sube";
  return r;
}
/* Lectura rápida de una noticia para tus instrumentos */
function lectura(ev, instruments) {
  const ind = indicador(ev.country, ev.title);
  if (!ind) return null;
  const cat = KB.categorias[ind.cat] || {};
  const syms = affects(ev, instruments);
  const out = { ind, cat: ind.cat, catName: cat.nombre || ind.cat, nota: cat.nota || "", mejor: ind.mejor || "", casos: [] };
  if (ind.mejor === "mayor" || ind.mejor === "menor") {
    const arribaBueno = ind.mejor === "mayor";
    out.casos = [
      { cuando: "arriba", bueno: arribaBueno, efectos: syms.map(s => [s, efecto(ind.cat, ev.country, s, arribaBueno)]) },
      { cuando: "abajo", bueno: !arribaBueno, efectos: syms.map(s => [s, efecto(ind.cat, ev.country, s, !arribaBueno)]) },
    ];
  }
  return out;
}

/* Markdown mínimo (## títulos, - viñetas, **negrita**) a HTML seguro. Sirve también con texto a medias. */
function mdToHtml(texto) {
  const e = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const inline = s => e(s).replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>").replace(/\*\*([^*]*)$/, "<b>$1</b>").replace(/(^|\s)\*([^*\s][^*]*)\*/g, "$1<i>$2</i>");
  const out = []; let lista = false;
  for (const linea of String(texto || "").replace(/<think>[\s\S]*?(<\/think>|$)/g, "").split("\n")) {
    const l = linea.trim();
    if (!l) { if (lista) { out.push("</ul>"); lista = false; } continue; }
    const h = l.match(/^#{1,4}\s+(.*)$/);
    const li = l.match(/^(?:[-*•]|\d+[.)])\s+(.*)$/);
    if (h) { if (lista) { out.push("</ul>"); lista = false; } out.push(`<h4>${inline(h[1])}</h4>`); }
    else if (li) { if (!lista) { out.push("<ul>"); lista = true; } out.push(`<li>${inline(li[1])}</li>`); }
    else { if (lista) { out.push("</ul>"); lista = false; } out.push(`<p>${inline(l)}</p>`); }
  }
  if (lista) out.push("</ul>");
  return out.join("");
}

/* Agenda de hoy sin IA: noticias de alto impacto de tus instrumentos agrupadas por hora */
function agendaHoy(events, instruments, now) {
  const d0 = startOfDay(now), grupos = new Map();
  for (const ev of events) {
    if (ev.at < d0 || ev.at >= d0 + DAY || ev.impact !== "high" || ev.tentative || !affects(ev, instruments).length) continue;
    const k = hhmm(ev.at);
    if (!grupos.has(k)) grupos.set(k, { hora: k, at: ev.at, evs: [] });
    grupos.get(k).evs.push(ev);
  }
  return [...grupos.values()].sort((a, b) => a.at - b.at);
}
function listaEs(nombres) {
  const n = [...new Set(nombres)];
  return n.length <= 1 ? (n[0] || "") : n.slice(0, -1).join(", ") + " y " + n[n.length - 1];
}

/* Texto de ejemplo con el formato de la IA (modo demo o sin Ollama). Usa solo la base de conocimiento. */
function iaEjemplo(ev, instruments, actual) {
  const lec = lectura(ev, instruments), ind = (lec || {}).ind || {};
  const nom = ev.es || ev.title, syms = affects(ev, instruments);
  const ref = ev.forecast || "la previsión";
  const flecha = d => d === "sube" ? "suele subir" : d === "baja" ? "suele bajar" : "no tiene una dirección clara";
  const efs = caso => caso ? caso.efectos.map(([s, d]) => `${INSTRUMENTS[s].short} ${flecha(d)}`).join(" y ") : "";
  if (actual) {
    const sp = sorpresa(ev.country, ev.title, actual, ev.forecast, ev.previous);
    const caso = lec && lec.casos.length ? (sp && sp.signo === (lec.casos[0].bueno ? 1 : -1) ? lec.casos[0] : lec.casos[1]) : null;
    return `## Qué ha salido\n${nom}: **${actual}** frente a ${ev.forecast || "—"} previsto. ${sp ? sp.texto + "." : ""}\n` +
      `## Qué puede pasar ahora\n- ${caso && sp && !sp.igual ? efs(caso) + "." : "Sin sorpresa clara: el mercado puede moverse poco."}\n` +
      `## Ojo con\n- Los primeros minutos suelen tener mucho ruido y huecos de precio.`;
  }
  const [arr, abj] = lec && lec.casos.length ? lec.casos : [null, null];
  return `## En pocas palabras\n${nom}${ind.mide ? ": " + ind.mide.charAt(0).toLowerCase() + ind.mide.slice(1) : "."} ${ind.importa || ""}\n` +
    `## Escenarios\n` +
    (arr ? `- **Por encima de ${ref}**: ${arr.bueno ? "bueno" : "malo"} para el ${ev.country}; ${efs(arr)}.\n` : "") +
    `- **En línea**: poco movimiento; el mercado mira el siguiente dato.\n` +
    (abj ? `- **Por debajo de ${ref}**: ${abj.bueno ? "bueno" : "malo"} para el ${ev.country}; ${efs(abj)}.\n` : "") +
    `## Lo que dice tu historial\nTodavía no hay mediciones de tu MT5 para esta noticia.\n` +
    `## Ojo con\n- ${syms.length ? "Afecta a " + syms.map(s => INSTRUMENTS[s].short).join(" y ") + "." : "No afecta a tus instrumentos."} ${(lec && lec.nota) || ""}`;
}

/* Serie intradía (velas de 15 min desde las 00:00) que acaba en el precio actual */
function intradaySeries(sym, now) {
  const m = DEMO_MARKET[sym]; if (!m) return [];
  const rnd = seeded(sym.split("").reduce((a, c) => a + c.charCodeAt(0), 0) * 97 + new Date(now).getDate());
  const n = Math.max(8, Math.floor((now - startOfDay(now)) / (15 * MIN)));
  const pts = [m.prev];
  for (let i = 1; i < n; i++) pts.push(pts[i - 1] * (1 + (rnd() - 0.5) * m.vol * 2.2));
  const drift = (m.price - pts[n - 1]) / (n - 1);
  return pts.map((p, i) => p + drift * i);
}

/* Últimos 5 días: apertura, máximo, mínimo, cierre */
function lastDays(sym, now) {
  const m = DEMO_MARKET[sym]; if (!m) return [];
  const rnd = seeded(sym.length * 7919 + 11);
  const out = []; let close = m.prev;
  let t = startOfDay(now) - DAY;
  const days = [];
  while (days.length < 5) { const d = new Date(t).getDay(); if (d !== 0 && d !== 6) days.unshift(t); t -= DAY; }
  const closes = [close];
  for (let i = 0; i < 4; i++) closes.unshift(closes[0] / (1 + (rnd() - 0.48) * m.vol * 14));
  for (let i = 0; i < 5; i++) {
    const c = closes[i + (closes.length - 5)];
    const o = i === 0 ? c / (1 + (rnd() - 0.5) * m.vol * 12) : out[i - 1].c;
    const hi = Math.max(o, c) * (1 + rnd() * m.vol * 6);
    const lo = Math.min(o, c) * (1 - rnd() * m.vol * 7);
    const bigH = 13 + Math.floor(rnd() * 8), bigM = [0, 30, 45, 15][Math.floor(rnd() * 4)];
    out.push({ t: days[i], o, h: hi, l: lo, c, bigAt: `${pad2(bigH)}:${pad2(bigM)}` });
  }
  return out;
}

/* Petición HTTP: en el iPhone la hace Swift (sin límites de CORS); en el navegador, fetch */
function httpRaw(method, url, headers, body, timeout = 10000) {
  return new Promise((resolve, reject) => {
    if (NATIVE) {
      const id = "r" + (++reqN);
      const timer = setTimeout(() => { delete pending[id]; reject(new Error("timeout")); }, timeout + 3000);
      pending[id] = (status, text) => { clearTimeout(timer); status > 0 ? resolve({ status, text }) : reject(new Error(text || "red")); };
      postNative({ type: "http", id, method, url, headers: headers || {}, body: body || "", timeout: timeout / 1000 });
    } else {
      const ctl = new AbortController(), timer = setTimeout(() => ctl.abort(), timeout);
      fetch(url, { method, headers, body: method === "GET" ? undefined : body, signal: ctl.signal })
        .then(r => r.text().then(text => resolve({ status: r.status, text })))
        .catch(err => reject(new Error(err.name === "AbortError" ? "timeout" : "red")))
        .finally(() => clearTimeout(timer));
    }
  });
}
function baseUrl() {
  let b = (S.server.url || "").trim().replace(/\/+$/, "");
  if (!b) return "";
  if (!/^https?:\/\//i.test(b)) b = "http://" + b;
  if (!/:\d+$/.test(b.replace(/^https?:\/\//i, ""))) b += ":8765";
  return b;
}
function api(method, path, data, timeout = 10000) {
  const base = baseUrl();
  if (!base) return Promise.reject(new Error("sin dirección"));
  return httpRaw(method, base + path, { "X-Clave": S.server.token || "", "Content-Type": "application/json" }, data ? JSON.stringify(data) : "", timeout)
    .then(r => {
      if (r.status === 401) throw new Error("clave");
      if (r.status >= 400) throw new Error("error " + r.status);
      return JSON.parse(r.text);
    });
}

let pollTimer = null, pollBusy = false;

function pollDelay() { if (document.hidden) return 60000; return ui.tab === "panel" || ui.tab === "bots" ? 5000 : 20000; }
function poll() {
  if (S.demo || !S.server.url) { conn.state = "idle"; refreshChips(); schedulePoll(15000); return; }
  if (pollBusy) return;
  pollBusy = true;
  const t0 = Date.now();
  const needCal = !S.cal || Date.now() - S.cal.at > 10 * MIN;
  api("GET", `/api/todo?symbols=${encodeURIComponent(S.instruments.join(","))}${needCal ? "&cal=1" : ""}`, null, 12000)
    .then(d => {
      const first = !LIVE;
      LIVE = d; conn.state = "ok"; conn.ping = Date.now() - t0; conn.at = Date.now(); conn.err = "";
      applyLive(d, first);
    })
    .catch(err => { conn.state = "error"; conn.err = errText(err); refreshVisible(); })
    .finally(() => { pollBusy = false; refreshChips(); schedulePoll(pollDelay()); });
}
function applyLive(d, first) {
  let changed = false;
  if (d.calendario && d.calendario.rows && d.calendario.rows.length && (!S.cal || d.calendario.at > S.cal.at)) {
    S.cal = { at: d.calendario.at, rows: d.calendario.rows, src: "PC" }; rebuildEvents(); changed = true;
  }
  for (const id of d.desactivados || []) {
    const a = S.alerts.find(x => x.id === id);
    if (a && a.on) { a.on = false; changed = true; }
  }
  if (d.ops_v && d.ops_v !== OPS.v && !OPS.busy) {          // hay operaciones nuevas: se piden aparte (pueden ser muchas)
    OPS.busy = true;
    api("GET", "/api/operaciones", null, 30000).then(r => {
      if (!r || !r.cuentas) return;
      OPS.v = r.v; OPS.cuentas = r.cuentas;
      for (const k in PERFIL) delete PERFIL[k];
      refreshVisible();
    }).catch(() => {}).finally(() => { OPS.busy = false; });
  }
  if (first) queueConfig(true);
  if (changed) save();
  if (first) renderAll(); else refreshVisible();
}

/* Cuánto ganas o pierdes, sumando todas las cuentas, si cada mercado se mueve un 1 % */
function exposicion(sym) {
  const out = {};
  for (const a of cuentas()) for (const p of a.posiciones) {
    if (sym && p.sym !== sym) continue;
    const e = out[p.sym] = out[p.sym] || { sym: p.sym, per1: 0, lots: 0, accs: {} };
    const v = fx((p.type === "buy" ? 1 : -1) * p.lots * (INSTRUMENTS[p.sym] || { ppl: 1 }).ppl * posPrice(p) * 0.01, a.moneda);
    e.per1 += v; e.lots += p.type === "buy" ? p.lots : -p.lots;
    e.accs[a.id] = (e.accs[a.id] || 0) + v;

}

/* ============================================================
   PANTALLA 3 · MONITOR
   La IA vigila los registros de cada ordenador, el diario de
   cada MT5 y tus operaciones. Aquí no se manejan los bots: se
   entiende qué está pasando y si es normal.
   ============================================================ */
const qtl = (xs, p) => xs[Math.min(xs.length - 1, Math.max(0, Math.round(p * (xs.length - 1))))];
const PERFIL = {};
const pathDe = t => t._path || (t._path = opPath(t));
function valorEn(t, e) {
  const d = t.close - t.open; if (d <= 0) return t.pl;
  const p = pathDe(t), f = Math.min(1, e / d) * (p.length - 1), i = Math.floor(f);
  return p[i] + (p[Math.min(i + 1, p.length - 1)] - p[i]) * (f - i);
}
/* Perfil aprendido de un bot: cómo suelen ir sus operaciones minuto a minuto (por lote) */
function perfilBot(b) {
  const k = botKey(b); if (k in PERFIL) return PERFIL[k];
  const a = cuentaDe(b.acc), ts = a ? tradesDe(a).filter(t => t.magic === b.magic && t.close <= Date.now()) : [];
  if (ts.length < 12) return (PERFIL[k] = null);
  const durs = ts.map(t => t.close - t.open).sort((x, y) => x - y), dMax = qtl(durs, 0.9), pts = [];
  for (let j = 0; j <= 14; j++) {
    const e = dMax * (j / 14) ** 2, vals = ts.filter(t => t.close - t.open >= e).map(t => valorEn(t, e) / t.lots).sort((x, y) => x - y);
    if (vals.length < 6) break;
    pts.push({ e, p10: qtl(vals, .1), p25: qtl(vals, .25), p50: qtl(vals, .5), p75: qtl(vals, .75), p90: qtl(vals, .9), n: vals.length });
  }
  const hs = ts.map(t => new Date(t.open).getHours()).sort((x, y) => x - y), lots = ts.map(t => t.lots).sort((x, y) => x - y);
  const gan = ts.filter(t => t.pl > 0 && t.mfe > 0), h1 = pts.find(x => x.e >= HOUR);
  return (PERFIL[k] = { ts, pts, dMax, durMed: qtl(durs, .5), hDesde: qtl(hs, .1), hHasta: qtl(hs, .9), lotsMed: qtl(lots, .5),
    win: ts.filter(t => t.pl > 0).length / ts.length * 100, exp: sumBy(ts, t => t.pl) / ts.length, h1: h1 ? h1.p50 : null,
    efi: gan.length ? sumBy(gan, t => t.pl / t.mfe) / gan.length * 100 : null });
}
const abiertaDesde = p => (p.abierta ? p.abierta * 1000 : BOOT + (p.at || 0) * MIN);
/* Una posición abierta comparada con lo que suele hacer su bot a esa misma altura */
function lupaPos(p) {
  const b = bots(p.acc).find(x => x.magic === p.magic); if (!b) return null;
  const pf = perfilBot(b), e = Date.now() - abiertaDesde(p), pl = posPL(p);
  if (!pf || !pf.pts.length) return { p, b, pf: null, e, pl, k: "na", rank: 0.5 };
  let cp = pf.pts[pf.pts.length - 1]; for (const x of pf.pts) if (x.e >= e) { cp = x; break; }
  const pll = pl / p.lots, vals = pf.ts.filter(t => t.close - t.open >= cp.e).map(t => ({ v: valorEn(t, cp.e) / t.lots, fin: t.pl }));
  const rank = vals.length ? vals.filter(x => x.v < pll).length / vals.length : 0.5;
  const sim = pll < cp.p50 ? vals.filter(x => x.v <= pll) : vals.filter(x => x.v >= pll);
  const k = rank < 0.1 ? "bad" : rank < 0.25 ? "mid" : rank > 0.9 ? "good" : "ok";
  return { p, b, pf, e, pl, cp, rank, k, largo: e > pf.dMax, fin: sim.length >= 3 ? sim.filter(x => x.fin > 0).length / sim.length : null, nsim: sim.length };
}
/* «va peor que el 92 %» sin llegar a decir 100 % */
function comparaTxt(rank, html) {
  const b = x => (html ? `<b>${x}</b>` : x);
  if (rank <= 0) return "ninguna iba tan mal a esta altura";
  if (rank >= 1) return "ninguna iba tan bien a esta altura";
  return rank < 0.5 ? `esta va peor que el ${b(Math.min(99, Math.round((1 - rank) * 100)) + " %")}` : `esta va mejor que el ${b(Math.min(99, Math.round(rank * 100)) + " %")}`;
}
const LK = { bad: ["high", "Fuera de lo normal"], mid: ["medium", "Peor de lo habitual"], ok: ["ok", "Normal"], good: ["acc", "Mejor de lo habitual"], na: ["off", "Sin historial"] };
/* Gráfico de abanico: la banda es lo normal para ese bot; el punto, esta operación */
function fanHtml(pf, lots, e, pl, k, h = 100) {
  const W = 320, H = h, P = 6, xMax = pl != null ? Math.min(Math.max(pf.dMax, e * 1.12), Math.max(e * 2.5, 30 * MIN)) : pf.dMax;
  let pts = pf.pts.filter(x => x.e <= xMax * 1.0001); if (pts.length < 2) pts = pf.pts.slice(0, 2);
  let mn = Math.min(0, ...pts.map(x => x.p10 * lots)), mx = Math.max(0, ...pts.map(x => x.p90 * lots));
  if (pl != null) { mn = Math.min(mn, pl); mx = Math.max(mx, pl); }
  const pad = (mx - mn) * 0.1 || 1; mn -= pad; mx += pad;
  const x = t => P + t / xMax * (W - 2 * P), y = v => P + (H - 2 * P) * (1 - (v - mn) / (mx - mn)), f = v => v.toFixed(1);
  const banda = (a, b) => pts.map((p, i) => `${i ? "L" : "M"}${f(x(p.e))},${f(y(p[a] * lots))}`).join("") + pts.slice().reverse().map(p => `L${f(x(p.e))},${f(y(p[b] * lots))}`).join("") + "Z";
  const med = pts.map((p, i) => `${i ? "L" : "M"}${f(x(p.e))},${f(y(p.p50 * lots))}`).join("");

/* ---------- salud de cada bot frente a su propia historia ---------- */
function saludBot(b) {
  const pf = perfilBot(b); if (!pf) return null;
  const ts = pf.ts.slice().sort((x, y) => x.close - y.close), ref = ts.slice(0, Math.floor(ts.length * 0.7)), rec = ts.slice(-20);
  const racha = xs => { let c = 0, m = 0; xs.forEach(t => { if (t.pl < 0) { c++; m = Math.max(m, c); } else c = 0; }); return m; };
  const caida = xs => { let eq = 0, pk = 0, dd = 0; xs.forEach(t => { eq += t.pl; pk = Math.max(pk, eq); dd = Math.max(dd, pk - eq); }); return dd; };
  let cur = 0; for (let i = ts.length - 1; i >= 0 && ts[i].pl < 0; i--) cur++;
  let eq = 0, pk = 0; ts.forEach(t => { eq += t.pl; pk = Math.max(pk, eq); });
  const refR = racha(ref), refDD = caida(ref), curDD = pk - eq, expRef = sumBy(ref, t => t.pl) / ref.length, expRec = sumBy(rec, t => t.pl) / rec.length;
  const sd = Math.sqrt(sumBy(ref, t => (t.pl - expRef) ** 2) / ref.length) || 1, z = (expRec - expRef) / (sd / Math.sqrt(rec.length));
  const umbral = Math.max(Math.ceil(1.5 * refR), refR + 3), motivos = [];
  if (cur > refR) motivos.push(`${cur} pérdidas seguidas (su peor racha era ${refR})`);
  const mon = v => `${fmtNum(v, 0)} ${cs(b.cur)}`;
  if (refDD && curDD >= 1.5 * refDD) motivos.push(`cae ${mon(curDD)} desde su máximo (su peor caída era ${mon(refDD)})`);
  if (z < -2) motivos.push(`últimas 20: ${fmtK(expRec)} por operación (antes ${fmtK(expRef)})`);
  const k = cur >= umbral || (refDD && curDD >= 2 * refDD) ? "bad" : motivos.length ? "mid" : "ok";
  return { k, cur, refR, curDD, refDD, expRef, expRec, z, motivos, wRec: rec.filter(t => t.pl > 0).length / rec.length * 100, wRef: ref.filter(t => t.pl > 0).length / ref.length * 100 };
}

/* ---------- la vigía: junta todo y decide qué merece tu atención ---------- */
function vigia() {
  const now = Date.now(), all = cuentas(), out = [];
  for (const a of all.filter(x => !x.online)) {
    const e = equipoDe(a.equipo), l = logsTodos().find(x => x.acc === a.id && x.lvl === "error");
    out.push({ sev: 3, ic: "plug", txt: `${a.nombre} sin datos desde hace ${durTxt(now - a.ultimo)}. ${e.online ? `${e.nombre} responde${l ? `; su diario dice «${l.txt}» a las ${hhmm(l.at)}` : ""}.` : `${e.nombre} no responde.`}`, act: "equipo", v: a.equipo });
  }
  const lup = all.filter(a => a.online).flatMap(a => a.posiciones.map(lupaPos)).filter(Boolean).sort((x, y) => x.rank - y.rank);
  for (const L of lup.filter(x => x.k === "bad" || x.k === "mid"))
    out.push({ sev: L.k === "bad" ? 3 : 2, ic: "target", txt: `${botName(L.b)}: su ${L.p.type === "buy" ? "compra" : "venta"} de ${symShort(L.p.sym)} lleva ${durTxt(L.e)} y ${L.rank <= 0 ? "ninguna de sus operaciones iba tan mal a esa altura" : `va peor que el ${Math.min(99, Math.round((1 - L.rank) * 100))} % de sus operaciones`}${L.p.sl ? "" : ". No tiene SL"}.`, act: "lupa", v: L.p.ticket });
  for (const b of bots()) { const s = saludBot(b); if (s && s.k !== "ok") out.push({ sev: s.k === "bad" ? 3 : 2, ic: "pulse", txt: `${botName(b)}: ${s.motivos[0]}.`, act: "page", v: "bot:" + botKey(b) }); }
  const avisos = logsTodos().filter(l => l.lvl === "warn" && now - l.at < 3 * HOUR);
  if (avisos.length) {
    const tipos = [[/requote|10004/i, "recotizaciones"], [/ping/i, "ping alto"], [/connection|reconect/i, "reconexiones"], [/failed|10\d{3}/i, "órdenes rechazadas"]]
      .filter(([rx]) => avisos.some(l => rx.test(l.txt))).map(x => x[1]);
    out.push({ sev: 1, ic: "note", txt: `${avisos.length} ${avisos.length === 1 ? "aviso" : "avisos"} en los registros de las últimas 3 horas${tipos.length ? ` (${listaEs(tipos)})` : ""}. Toca para verlos.`, act: "page", v: "registro" });
  }
  out.sort((x, y) => y.sev - x.sev);
  const k = out.some(h => h.sev === 3) ? "bad" : out.some(h => h.sev === 2) ? "mid" : "ok";
  const V = live() ? (LIVE.vigia || {}) : null;
  return { out, k, lup, at: V ? (V.at || now) : now - 40000, nLin: V ? (V.lineas || logsTodos().length) : logsTodos().length * 86 + 3, nOps: all.reduce((s, a) => s + tradesDe(a).length, 0) };
}

const MESES_FF = { Jan: 0, Feb: 1, Mar: 2, Apr: 3, May: 4, Jun: 5, Jul: 6, Aug: 7, Sep: 8, Oct: 9, Nov: 10, Dec: 11 };
function fechaFF(s) {   // "Sep 26, 2026" -> {d, txt: "26 sep 2026", key: "26/09/2026"}
  const m = String(s || "").match(/^([A-Z][a-z]{2})[a-z]*\.?\s+(\d{1,2}),?\s+(\d{4})/);
  if (!m || MESES_FF[m[1]] == null) return { txt: s || "", key: "" };
  const mes = MESES_FF[m[1]], dia = +m[2];
  return { txt: `${dia} ${MONTHS_SHORT[mes]} ${m[3]}`, key: `${pad2(dia)}/${pad2(mes + 1)}/${m[3]}` };
}
function peticionEv(ev) {

function fichaCargar(ev) {

  const k = ev.id, f = ui.ficha[k];
  if (f && (f.estado === "cargando" || (f.estado === "ok" && Date.now() - f.t < 5 * MIN))) return;
  ui.ficha[k] = { estado: "cargando", t: Date.now(), ...(f && f.estado === "ok" ? f : {}) };
  const q = Object.entries(peticionEv(ev)).map(([a, b]) => `${a}=${encodeURIComponent(b || "")}`).join("&");
  api("GET", "/api/noticia?" + q, null, 30000)
    .then(r => {
      if (!r.ok) throw new Error(r.error || "error");
      ui.ficha[k] = { estado: "ok", t: Date.now(), ...r };

    .catch(err => { ui.ficha[k] = { estado: "error", t: Date.now(), error: "Tu PC " + errText(err) }; })
    .finally(() => { if (evAbierto() === k) { if (curPage()) renderPage(false); else renderSheet(); } });
}

/* Pide un trabajo a la IA del PC y va copiando el texto en `destino` mientras se escribe */
function iaSeguir(id, destino, refrescar, fallos = 0) {
  api("GET", "/api/ia/trabajo?id=" + id, null, 8000).then(t => {
    if (!t.ok) throw new Error(t.error || "error");
    Object.assign(destino, { estado: t.estado, texto: t.texto, modelo: t.modelo, segundos: t.segundos, delante: t.delante, error: t.error, fuentes: t.fuentes || [] });
    if (t.estado === "hecho") destino.at = Date.now();
    refrescar();
    if (t.estado !== "hecho" && t.estado !== "error") setTimeout(() => iaSeguir(id, destino, refrescar), t.estado === "cola" ? 1500 : 600);
  }).catch(err => {
    if (fallos < 3 && err.message !== "error") return setTimeout(() => iaSeguir(id, destino, refrescar, fallos + 1), 1500);
    Object.assign(destino, { estado: "error", error: err.message && err.message.length > 14 ? err.message : "Tu PC " + errText(err) });
    refrescar();
  });
}
function iaPedir(ruta, cuerpo, destino, refrescar) {
  Object.assign(destino, { estado: "cargando", texto: "", error: "" });
  refrescar();
  api("POST", ruta, cuerpo, 15000).then(r => {
    if (!r.ok) throw new Error(r.error || "La IA no está disponible");
    if (r.texto != null) { Object.assign(destino, { estado: "hecho", texto: r.texto, modelo: r.modelo, at: r.at || Date.now() }); refrescar(); return; }
    iaSeguir(r.id, destino, refrescar);
  }).catch(err => {
    Object.assign(destino, { estado: "error", error: err.message && err.message.length > 14 ? err.message : "Tu PC " + errText(err) });
    refrescar();
  });
}
/* Modo demo: escribe un texto de ejemplo poco a poco */
function iaSimular(destino, texto, refrescar) {
  Object.assign(destino, { estado: "pensando", texto: "", segundos: 0, demo: true });
  refrescar();
  const palabras = texto.match(/\S+\s*/g) || [];
  let i = 0;
  setTimeout(function paso() {
    destino.estado = "escribiendo";
    destino.texto += palabras.slice(i, i + 3).join(""); i += 3;
    if (i >= palabras.length) { destino.estado = "hecho"; destino.at = Date.now(); }
    refrescar();
    if (destino.estado !== "hecho") setTimeout(paso, 45);

  }
  if (a.kind === "agenda") {
    const g = agendaHoy(EVENTS, S.instruments, Date.now());
    if (!g.length) return ["Agenda de hoy", `Hoy no hay noticias de alto impacto para ${listaEs(S.instruments.map(symShort))}.`];

  }
  if (a.kind === "vigia") { const L = vigia().lup[0];
    return L && L.pf ? [`${botName(L.b)}: ${comparaTxt(L.rank, false).replace(/^esta /, "")}`, `${L.p.type === "buy" ? "Compra" : "Venta"} ${fmtNum(L.p.lots, 2)} ${symShort(L.p.sym)} · ${fmtMoney(L.pl, true, cs())} a los ${durTxt(L.e)}${L.p.sl ? "" : " y sin SL"}. IA: el diario dice que el bot no pudo poner el stop loss (Invalid stops).`]
